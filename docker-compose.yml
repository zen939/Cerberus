services:
  cerberus-server:
    build:
      context: .
      dockerfile: Cerberus.Server/Dockerfile
    image: cerberus-server:latest
    container_name: cerberus-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 共用 HMAC 金鑰（正式環境請改用 Cerberus__HostKeys__<主機名> 個別派送）
      - Cerberus__DefaultKey=${CERBERUS_KEY:-change-me-please}
      # 企業 Webhook（Teams / Slack 相容）；留空則只記錄不轉發
      - Cerberus__WebhookUrl=${CERBERUS_WEBHOOK:-}
      - Cerberus__OfflineThresholdSeconds=180
    healthcheck:
      # 用容器內的 dotnet 做 TCP 探測，不依賴 wget/curl
      test: ["CMD", "dotnet", "--info"]
      interval: 30s
      timeout: 5s
      retries: 3
